[project]
name = 'docsearch-scraper'
version = '1.0.0'
description = 'Scrape documentation and push to Algolia Search'
requires-python = '>=3.12'
dependencies = [
    'scrapy>=2.12',
    'algoliasearch>=2.0,<3.0',
    'lxml>=5.0',
]

[dependency-groups]
dev = [
    'pytest>=8.0',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src']
